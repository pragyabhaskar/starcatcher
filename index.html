
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Defender</title>

<style>
body {
    margin: 0;
    background: #080d20;
    color: white;
    text-align: center;
    font-family: Arial;
}

h1 { color: #70eaff; }

canvas {
    background: #080d20;
    border: 2px solid #70eaff;
    border-radius: 12px;
    max-width: 96%;
}

button {
    padding: 12px 25px;
    margin: 15px;
    border: none;
    border-radius: 8px;
    background: #70eaff;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🌍 EARTH DEFENDER 🚀</h1>
<p>Protect Earth from falling rocks!</p>

<h3>
❤️ <span id="health">3</span>
&nbsp;&nbsp;&nbsp;
🏆 Score: <span id="score">0</span>
</h3>

<canvas id="game" width="700" height="500"></canvas>

<br>
<button onclick="restart()">Restart Game</button>

<p>← → Move | ↑ Shoot Laser | SPACE Pause / Resume</p>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, rocks, lasers;
let score, health, gameOver, paused;
let keys = {};
let frame = 0;

// Restart
function restart() {

    player = {
        x: 325,
        y: 390,
        speed: 6
    };

    rocks = [];
    lasers = [];

    score = 0;
    health = 3;
    gameOver = false;
    paused = false;
    frame = 0;

    keys = {};

    updateUI();
}

// Keyboard controls
document.addEventListener("keydown", e => {

    if (["Space", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
    }

    if (e.repeat) return;

    if (e.code === "Space" && !gameOver) {
        paused = !paused;
    }

    keys[e.code] = true;
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

// Update score and health
function updateUI() {

    document.getElementById("health").textContent =
        "❤️".repeat(health) || "0";

    document.getElementById("score").textContent = score;
}

// Draw Earth
function drawEarth() {

    let gradient = ctx.createRadialGradient(
        320, 455, 10,
        350, 510, 180
    );

    gradient.addColorStop(0, "#64e6ff");
    gradient.addColorStop(0.5, "#1677c8");
    gradient.addColorStop(1, "#082b72");

    ctx.beginPath();
    ctx.arc(350, 510, 155, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Continents
    ctx.fillStyle = "#48c77a";

    ctx.beginPath();
    ctx.ellipse(290, 440, 38, 20, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(390, 475, 28, 40, 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Atmosphere
    ctx.beginPath();
    ctx.arc(350, 510, 160, Math.PI, 0);
    ctx.strokeStyle = "#6deaff";
    ctx.lineWidth = 4;
    ctx.stroke();
}

// Spaceship
function drawPlayer() {
    ctx.font = "42px Arial";
    ctx.fillText("🚀", player.x, player.y + 10);
}

// Rocks
function drawRocks() {

    rocks.forEach(r => {

        ctx.beginPath();
        ctx.arc(r.x, r.y, r.size, 0, Math.PI * 2);

        ctx.fillStyle = "#92939e";
        ctx.fill();

        ctx.strokeStyle = "#d4d4dc";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#555663";

        ctx.beginPath();
        ctx.arc(r.x - 5, r.y - 4, 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Lasers
function drawLasers() {

    lasers.forEach(l => {

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff4bfa";

        ctx.fillStyle = "#ff4bfa";
        ctx.fillRect(l.x, l.y, 6, 22);

        ctx.shadowBlur = 0;
    });
}

// Spawn rocks
function spawnRocks() {

    if (rocks.length < 3 && frame % 90 === 0) {

        rocks.push({
            x: 30 + Math.random() * 640,
            y: -30,
            size: 16 + Math.random() * 8,
            speed: 1.2 + Math.random() * 0.6
        });
    }
}

// Shoot laser using UP arrow
function shoot() {

    if (keys["ArrowUp"] && frame % 8 === 0) {

        lasers.push({
            x: player.x + 22,
            y: player.y - 20,
            speed: 14
        });
    }
}

// Update game
function update() {

    if (gameOver || paused) return;

    frame++;

    // Player movement
    if (keys["ArrowLeft"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"]) {
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(650, player.x)
    );

    shoot();
    spawnRocks();

    // Move rocks
    for (let i = rocks.length - 1; i >= 0; i--) {

        let r = rocks[i];
        r.y += r.speed;

        // Rock reaches Earth
        if (r.y + r.size >= 365) {

            rocks.splice(i, 1);
            health--;

            updateUI();
        }
    }

    // Move lasers
    for (let i = lasers.length - 1; i >= 0; i--) {

        lasers[i].y -= lasers[i].speed;

        if (lasers[i].y < 0) {
            lasers.splice(i, 1);
        }
    }

    // Laser-rock collision
    for (let i = rocks.length - 1; i >= 0; i--) {

        let r = rocks[i];
        let destroyed = false;

        for (let j = lasers.length - 1; j >= 0; j--) {

            let l = lasers[j];

            let dx = l.x - r.x;
            let dy = l.y - r.y;

            if (Math.sqrt(dx * dx + dy * dy) < r.size + 10) {

                rocks.splice(i, 1);
                lasers.splice(j, 1);

                score += 10;
                updateUI();

                destroyed = true;
                break;
            }
        }

        if (destroyed) continue;
    }

    // Game over
    if (health <= 0) {

        health = 0;
        gameOver = true;
        updateUI();
    }
}

// Draw game
function draw() {

    ctx.clearRect(0, 0, 700, 500);

    drawEarth();
    drawRocks();
    drawLasers();
    drawPlayer();

    if (paused || gameOver) {

        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, 700, 500);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";

        ctx.font = "40px Arial";

        ctx.fillText(
            gameOver ? "EARTH DESTROYED!" : "PAUSED",
            350, 220
        );

        ctx.font = "22px Arial";

        ctx.fillText(
            gameOver
                ? "Final Score: " + score
                : "Press SPACE to Resume",
            350, 265
        );

        ctx.textAlign = "left";
    }
}

// Game loop
function loop() {

    update();
    draw();

    requestAnimationFrame(loop);
}

restart();
loop();

</script>
</body>
</html>
