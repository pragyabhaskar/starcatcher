
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Defender</title>

<style>
body {
    margin: 0;
    background: #080d20;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
}

h1 {
    color: #70eaff;
}

canvas {
    background: #080d20;
    border: 2px solid #70eaff;
    border-radius: 12px;
    max-width: 96%;
}

button {
    padding: 12px 25px;
    margin: 15px;
    border: none;
    border-radius: 8px;
    background: #70eaff;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🌍 EARTH DEFENDER 🚀</h1>
<p>Protect Earth from falling rocks!</p>

<h3>
❤️ <span id="health">❤️❤️❤️</span>
&nbsp;&nbsp;
🏆 Score: <span id="score">0</span>
</h3>

<h3>
Difficulty Level: <span id="level">1</span>
</h3>

<canvas id="game" width="700" height="500"></canvas>

<br>

<button onclick="restart()">Restart Game</button>

<p>← → Move | ↑ Shoot Laser | SPACE Pause / Resume / Restart</p>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, rocks, lasers;

let score, health;
let gameOver, paused;

let keys = {};
let frame = 0;

// Difficulty settings
const MAX_ROCKS = 5;
const MAX_ROCK_SPEED = 3.4;
const MAX_SPAWN_INTERVAL = 50;

// Restart game
function restart() {

    player = {
        x: 325,
        y: 390,
        speed: 6
    };

    rocks = [];
    lasers = [];

    score = 0;
    health = 3;

    gameOver = false;
    paused = false;

    frame = 0;
    keys = {};

    updateUI();
}

// Keyboard controls
document.addEventListener("keydown", e => {

    if (
        ["Space", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.code)
    ) {
        e.preventDefault();
    }

    if (e.repeat) return;

    // SPACE: pause, resume or restart
    if (e.code === "Space") {

        if (gameOver) {
            restart();
        } else {
            paused = !paused;
        }

        return;
    }

    keys[e.code] = true;
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

// Difficulty calculation
function getDifficulty() {

    // One level every 15 seconds
    // Maximum level: 5
    let level = Math.min(
        5,
        1 + Math.floor(frame / 900)
    );

    // Rock speed gradually increases
    let baseSpeed = Math.min(
        1.5 + (level - 1) * 0.35,
        MAX_ROCK_SPEED
    );

    // More rocks appear over time
    let maxRocks = Math.min(
        5,
        1 + level
    );

    // Spawn interval decreases gradually
    // Lower interval means more frequent rocks
    let spawnInterval = Math.max(
        MAX_SPAWN_INTERVAL,
        100 - (level - 1) * 12
    );

    return {
        level,
        baseSpeed,
        maxRocks,
        spawnInterval
    };
}

// Update score, health and level
function updateUI() {

    document.getElementById("health").textContent =
        "❤️".repeat(health) || "0";

    document.getElementById("score").textContent = score;

    document.getElementById("level").textContent =
        getDifficulty().level;
}

// Draw Earth
function drawEarth() {

    let gradient = ctx.createRadialGradient(
        320, 455, 10,
        350, 510, 180
    );

    gradient.addColorStop(0, "#64e6ff");
    gradient.addColorStop(0.5, "#1677c8");
    gradient.addColorStop(1, "#082b72");

    ctx.beginPath();
    ctx.arc(350, 510, 155, 0, Math.PI * 2);

    ctx.fillStyle = gradient;
    ctx.fill();

    // Continents
    ctx.fillStyle = "#48c77a";

    ctx.beginPath();
    ctx.ellipse(
        290, 440, 38, 20,
        -0.5, 0, Math.PI * 2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
        390, 475, 28, 40,
        0.5, 0, Math.PI * 2
    );
    ctx.fill();

    // Atmosphere
    ctx.beginPath();
    ctx.arc(350, 510, 160, Math.PI, 0);

    ctx.strokeStyle = "#6deaff";
    ctx.lineWidth = 4;
    ctx.stroke();
}

// Spaceship
function drawPlayer() {

    ctx.font = "42px Arial";

    ctx.fillText(
        "🚀",
        player.x,
        player.y + 10
    );
}

// Draw rocks
function drawRocks() {

    rocks.forEach(r => {

        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            r.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#92939e";
        ctx.fill();

        ctx.strokeStyle = "#d4d4dc";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Rock details
        ctx.fillStyle = "#555663";

        ctx.beginPath();
        ctx.arc(
            r.x - 5,
            r.y - 4,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });
}

// Draw lasers
function drawLasers() {

    lasers.forEach(l => {

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff4bfa";

        ctx.fillStyle = "#ff4bfa";

        ctx.fillRect(
            l.x,
            l.y,
            6,
            22
        );

        ctx.shadowBlur = 0;
    });
}

// Spawn rocks with increasing difficulty
function spawnRocks() {

    let difficulty = getDifficulty();

    if (
        rocks.length < difficulty.maxRocks &&
        frame % difficulty.spawnInterval === 0
    ) {

        rocks.push({

            x: 30 + Math.random() * 640,

            y: -30,

            size: 16 + Math.random() * 8,

            speed: Math.min(
                difficulty.baseSpeed + Math.random() * 0.4,
                MAX_ROCK_SPEED
            )

        });
    }
}

// Shoot laser with UP arrow
function shoot() {

    if (
        keys["ArrowUp"] &&
        frame % 8 === 0
    ) {

        lasers.push({

            x: player.x + 22,

            y: player.y - 20,

            speed: 14

        });
    }
}

// Main game update
function update() {

    if (gameOver || paused) return;

    frame++;

    // Player movement
    if (keys["ArrowLeft"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"]) {
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(650, player.x)
    );

    // Update difficulty display
    if (frame % 60 === 0) {
        updateUI();
    }

    shoot();
    spawnRocks();

    // Move rocks and detect Earth collision
    for (let i = rocks.length - 1; i >= 0; i--) {

        let r = rocks[i];

        r.y += r.speed;

        if (r.y + r.size >= 365) {

            rocks.splice(i, 1);

            health--;

            updateUI();
        }
    }

    // Move lasers
    for (let i = lasers.length - 1; i >= 0; i--) {

        lasers[i].y -= lasers[i].speed;

        if (lasers[i].y < 0) {
            lasers.splice(i, 1);
        }
    }

    // Laser and rock collision
    for (let i = rocks.length - 1; i >= 0; i--) {

        let r = rocks[i];
        let destroyed = false;

        for (let j = lasers.length - 1; j >= 0; j--) {

            let l = lasers[j];

            let dx = l.x - r.x;
            let dy = l.y - r.y;

            let distance = Math.sqrt(
                dx * dx + dy * dy
            );

            if (distance < r.size + 10) {

                rocks.splice(i, 1);
                lasers.splice(j, 1);

                score += 10;

                updateUI();

                destroyed = true;

                break;
            }
        }

        if (destroyed) continue;
    }

    // Game over
    if (health <= 0) {

        health = 0;

        gameOver = true;

        updateUI();
    }
}

// Draw game
function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawEarth();
    drawRocks();
    drawLasers();
    drawPlayer();

    if (paused || gameOver) {

        ctx.fillStyle = "rgba(0,0,0,0.75)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "white";

        ctx.textAlign = "center";

        ctx.font = "40px Arial";

        ctx.fillText(
            gameOver ? "EARTH DESTROYED!" : "PAUSED",
            350,
            220
        );

        ctx.font = "22px Arial";

        ctx.fillText(
            gameOver
                ? "Final Score: " + score + " | SPACE to Restart"
                : "Press SPACE to Resume",
            350,
            265
        );

        ctx.textAlign = "left";
    }
}

// Game loop
function loop() {

    update();

    draw();

    requestAnimationFrame(loop);
}

// Start
restart();
loop();

</script>

</body>
</html>
