
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Catcher</title>

<style>
    body {
        margin: 0;
        background: #10152b;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #ffe477;
        margin-top: 25px;
    }

    canvas {
        background: linear-gradient(#18264b, #10152b);
        border: 2px solid #ffe477;
        border-radius: 12px;
        max-width: 95%;
    }

    button {
        background: #ffe477;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin: 15px;
    }
</style>
</head>

<body>

<h1>⭐ STAR CATCHER ⭐</h1>
<p>Catch the falling stars. Don't let them escape!</p>

<h3>Score: <span id="score">0</span></h3>

<canvas id="game" width="700" height="450"></canvas>

<br>
<button onclick="restart()">Restart Game</button>

<p>Use ← → arrow keys to move.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x: 320,
    y: 400,
    width: 65,
    height: 25,
    speed: 7
};

let stars = [];
let score = 0;
let gameOver = false;
let keys = {};

document.addEventListener("keydown", e => {
    keys[e.key] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

function createStar() {
    stars.push({
        x: Math.random() * 670,
        y: -20,
        size: 12,
        speed: 2 + Math.random() * 2
    });
}

function drawPlayer() {
    ctx.fillStyle = "#70e1ff";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.fillText("🛸", player.x + 15, player.y + 2);
}

function drawStars() {
    ctx.font = "24px Arial";

    stars.forEach(star => {
        ctx.fillText("⭐", star.x, star.y);
    });
}

function update() {
    if (gameOver) return;

    if (keys["ArrowLeft"] || keys["a"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] || keys["d"]) {
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(canvas.width - player.width, player.x)
    );

    stars.forEach((star, index) => {
        star.y += star.speed;

        // Collision detection
        if (
            star.x + star.size > player.x &&
            star.x < player.x + player.width &&
            star.y > player.y &&
            star.y < player.y + player.height + 20
        ) {
            stars.splice(index, 1);
            score++;
            document.getElementById("score").textContent = score;
        }

        // Missed star
        else if (star.y > canvas.height) {
            stars.splice(index, 1);
        }
    });

    if (Math.random() < 0.025 + score * 0.0003) {
        createStar();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawStars();
    drawPlayer();

    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 225, 210);

        ctx.font = "20px Arial";
        ctx.fillText("Final Score: " + score, 280, 250);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function restart() {
    player.x = 320;
    stars = [];
    score = 0;
    gameOver = false;
    document.getElementById("score").textContent = score;
}

// End game after 60 seconds
let timer = 60;
let countdown = setInterval(() => {
    if (!gameOver) {
        timer--;

        if (timer <= 0) {
            gameOver = true;
            clearInterval(countdown);
        }
    }
}, 1000);

loop();
</script>

</body>
</html>
